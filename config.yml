default_game_path: null
default_save_path: save.bin
timestamp: null
key_map:
  # shoulder buttons
  - key:
      key_code: P
      modifiers: null
    binding: !Button R
  - key:
      key_code: Q
      modifiers: null
    binding: !Button L

  # WASD directional pad
  - key:
      key_code: W
      modifiers: null
    binding: !Button Up
  - key:
      key_code: A
      modifiers: null
    binding: !Button Left
  - key:
      key_code: S
      modifiers: null
    binding: !Button Down
  - key:
      key_code: D
      modifiers: null
    binding: !Button Right

  # IJKL buttons
  - key:
      key_code: I
      modifiers: null
    binding: !Button X
  - key:
      key_code: J
      modifiers: null
    binding: !Button Y
  - key:
      key_code: K
      modifiers: null
    binding: !Button B
  - key:
      key_code: L
      modifiers: null
    binding: !Button A

  - key:
      key_code: Space
      modifiers: null
    binding: !Button Start
  - key:
      key_code: X
      modifiers: null
    binding: !Button Select

  # the lid is absolute state, so it gets a key each way rather than a toggle
  - key:
      key_code: Slash
      modifiers: null
    binding: CloseLid
  - key:
      key_code: Semicolon
      modifiers: null
    binding: OpenLid

  # emulator pausing/frame-by-frame
  - key:
      key_code: Period
      modifiers: null
    binding: Step
  - key:
      key_code: Comma
      modifiers: null
    binding: PlayPause

  # write savedata to disk
  - key:
      key_code: S
      modifiers: CTRL
    binding: !WriteSavedata save.bin

  # reading savestates
  - key:
      key_code: Num1
      modifiers: null
    binding: !ReadSavestate Savestate1.bin
  - key:
      key_code: Num2
      modifiers: null
    binding: !ReadSavestate Savestate2.bin
  - key:
      key_code: Num3
      modifiers: null
    binding: !ReadSavestate Savestate3.bin
  - key:
      key_code: Num4
      modifiers: null
    binding: !ReadSavestate Savestate4.bin
  - key:
      key_code: Num5
      modifiers: null
    binding: !ReadSavestate Savestate5.bin
  - key:
      key_code: Num6
      modifiers: null
    binding: !ReadSavestate Savestate6.bin
  - key:
      key_code: Num7
      modifiers: null
    binding: !ReadSavestate Savestate7.bin
  - key:
      key_code: Num8
      modifiers: null
    binding: !ReadSavestate Savestate8.bin
  - key:
      key_code: Num9
      modifiers: null
    binding: !ReadSavestate Savestate9.bin
  - key:
      key_code: Num0
      modifiers: null
    binding: !ReadSavestate Savestate10.bin

  # writing savestates
  - key:
      key_code: Num1
      modifiers: CTRL
    binding: !WriteSavestate Savestate1.bin
  - key:
      key_code: Num2
      modifiers: CTRL
    binding: !WriteSavestate Savestate2.bin
  - key:
      key_code: Num3
      modifiers: CTRL
    binding: !WriteSavestate Savestate3.bin
  - key:
      key_code: Num4
      modifiers: CTRL
    binding: !WriteSavestate Savestate4.bin
  - key:
      key_code: Num5
      modifiers: CTRL
    binding: !WriteSavestate Savestate5.bin
  - key:
      key_code: Num6
      modifiers: CTRL
    binding: !WriteSavestate Savestate6.bin
  - key:
      key_code: Num7
      modifiers: CTRL
    binding: !WriteSavestate Savestate7.bin
  - key:
      key_code: Num8
      modifiers: CTRL
    binding: !WriteSavestate Savestate8.bin
  - key:
      key_code: Num9
      modifiers: CTRL
    binding: !WriteSavestate Savestate9.bin
  - key:
      key_code: Num0
      modifiers: CTRL
    binding: !WriteSavestate Savestate10.bin

  # replay read/write mode
  - key:
      key_code: Tab
      modifiers: null
    binding: ToggleReplayMode

  # replay save
  - key:
      key_code: R
      modifiers: CTRL
    binding: SaveReplay

  # write main RAM to disk (for analysis)
  - key:
      key_code: D
      modifiers: CTRL
    binding: !WriteMainRam ram.bin
